      localStorage.setItem('yuma_likes', JSON.stringify(state.likedPosts));
    }

    window.onload = () => {
      document.getElementById('screen-lock').style.backgroundImage = `url('${ASSETS.lock_bg}')`;
      document.getElementById('screen-home').style.backgroundImage = `url('${ASSETS.home_bg}')`;
      updateClock();
      setInterval(updateClock, 1000);
      updateBadges();

      if (!sessionStorage.getItem('visited')) {
        setTimeout(() => {
          showToast('시스템 알림', '해당 사이트는 가상 시뮬레이션입니다.');
          sessionStorage.setItem('visited', 'true');
        }, 800);
      }
    };

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
      document.getElementById('clock-time').textContent = timeStr;
      document.getElementById('lock-clock').textContent = timeStr;
      const dateStr = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
      document.getElementById('lock-date').textContent = dateStr;
    }

    function pressPass(val) {
      if (val === 'del') {
        state.passcode = '';
      } else if (state.passcode.length < 4) {
        state.passcode += val;
      }
      for (let i = 0; i < 4; i++) {
        document.getElementById(`dot-${i}`).classList.toggle('filled', i < state.passcode.length);
      }
      if (state.passcode.length === 4) {
        if (state.passcode === '0207') {
          setTimeout(() => {
            document.getElementById('screen-lock').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
            state.unlocked = true;
            triggerKakaoToasts();
          }, 150);
        } else {
          setTimeout(() => {
            alert('비밀번호가 올바르지 않습니다. (0207)');
            state.passcode = '';
            for (let i = 0; i < 4; i++) document.getElementById(`dot-${i}`).classList.remove('filled');
          }, 200);
        }
      }
    }

    function triggerKakaoToasts() {
      if (state.currentApp === 'kakao') return;
      setTimeout(() => {
        if (!state.toastTriggered[0] && state.currentApp !== 'kakao') {
          showToast('🐱', '문자 봣엉??');
          state.toastTriggered[0] = true;
        }
      }, 10000);

      setTimeout(() => {
        if (!state.toastTriggered[1] && state.currentApp !== 'kakao') {
          showToast('🐱', 'メッセージ!!!🤨');
          state.toastTriggered[1] = true;
        }
      }, 20000);
    }

    function showToast(sender, body) {
      document.getElementById('toast-sender').textContent = sender;
      document.getElementById('toast-body').textContent = body;
      const toast = document.getElementById('toast-banner');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function openToastApp() {
      document.getElementById('toast-banner').classList.remove('show');
      openApp('kakao');
    }

    function openApp(appName) {
      state.currentApp = appName;
      document.getElementById('screen-home').classList.add('hidden');
      document.getElementById('screen-app').classList.remove('hidden');
      document.getElementById('status-bar').classList.add('dark');

      const body = document.getElementById('app-body');
      const title = document.getElementById('app-header-title');

      if (appName === 'photos') renderPhotos(body, title);
      else if (appName === 'phone') renderPhone(body, title);
      else if (appName === 'messages') renderMessages(body, title);
      else if (appName === 'kakao') renderKakao(body, title);
      else if (appName === 'calendar') renderCalendar(body, title);
      else if (appName === 'music') renderMusic(body, title);
      else if (appName === 'instagram') renderInstagram(body, title);
    }

    function goHome() {
      state.currentApp = '';
      document.getElementById('screen-app').classList.add('hidden');
      document.getElementById('screen-home').classList.remove('hidden');
      document.getElementById('status-bar').classList.remove('dark');
      updateBadges();
    }

    function dummyApp() { alert('이 앱은 시뮬레이션에서 사용할 수 없습니다.'); }

    function updateBadges() {
      const bMsg = document.getElementById('badge-msg');
      const bKa = document.getElementById('badge-kakao');
      if (state.msgUnread > 0) { bMsg.textContent = state.msgUnread; bMsg.classList.remove('hidden'); }
      else bMsg.classList.add('hidden');
      if (state.kakaoUnread > 0) { bKa.textContent = state.kakaoUnread; bKa.classList.remove('hidden'); }
      else bKa.classList.add('hidden');
    }

    function renderPhotos(body, title) {
      title.textContent = '보관함';
      let html = `<div class="photo-grid">`;
      ASSETS.photos.forEach((src) => {
        html += `<button class="photo-thumb" style="background-image:url('${src}')" onclick="viewPhoto('${src}')"></button>`;
      });
      html += `</div>`;
      body.innerHTML = html;
    }

    function viewPhoto(src) {
      const body = document.getElementById('app-body');
      body.innerHTML += `
        <div class="photo-viewer" id="pv" onclick="document.getElementById('pv').remove()">
          <img src="${src}">
        </div>`;
    }

    function renderPhone(body, title) {
      title.textContent = '최근 통화';
      const calls = [
        ["ユウマ 🐱🖤", "발신 통화", "오늘"],
        ["민서", "발신", "어제"],
        ["ユウマ🐱🖤", "수신 통화", "어제"],
        ["ユウマ🐱🖤", "부재중 전화 3회", "어제", true],
        ["엄마♥", "수신", "월요일"],
        ["민서", "발신", "일요일"],
        ["ユウマ🐱🖤", "발신", "일요일"],
        ["ユウマ🐱🖤", "발신", "토요일"],
        ["아빠♥", "수신", "금요일"]
      ];

      let html = `<div>`;
      calls.forEach(c => {
        html += `
          <div style="padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:0.5px solid #e5e5ea;" onclick="openContact('${c[0]}')">
            <div>
              <div style="font-weight:600; font-size:16px; color:${c[3]?'#ff3b30':'#000'};">${c[0]}</div>
              <div style="font-size:13px; color:#8e8e93; margin-top:2px;">${c[1]}</div>
            </div>
            <div style="font-size:13px; color:#8e8e93;">${c[2]}</div>
          </div>`;
      });
      html += `</div>`;
      body.innerHTML = html;
    }

    function openContact(name) {
      if (!name.includes('ユウマ')) { alert('이 연락처는 비활성화되어 있습니다.'); return; }
      const body = document.getElementById('app-body');
      body.innerHTML = `
        <div style="padding:20px; text-align:center;">
          <div style="width:90px; height:90px; border-radius:50%; background-image:url('${ASSETS.yuma_profile}'); background-size:cover; margin:0 auto 12px;"></div>
          <h2 style="font-size:22px; font-weight:700;">ユウマ🐱🖤</h2>
          <div style="display:flex; justify-content:center; gap:16px; margin:20px 0;">
            <button onclick="openApp('messages')" style="padding:10px 18px; border-radius:12px; border:none; background:#007aff; color:#fff; font-weight:600;">메시지</button>
            <button onclick="startCall()" style="padding:10px 18px; border-radius:12px; border:none; background:#34c759; color:#fff; font-weight:600;">음성 통화</button>
          </div>
        </div>`;
    }

    function startCall() {
      const body = document.getElementById('app-body');
      body.innerHTML = `
        <div class="call-screen">
          <div style="text-align:center;">
            <div class="call-avatar" style="background-image:url('${ASSETS.yuma_profile}')"></div>
            <h2 style="font-size:24px; font-weight:600;">ユウマ🐱🖤</h2>
            <p style="color:#8e8e93; margin-top:6px;" id="call-status">연결 중…</p>
          </div>
          <button onclick="endCall()" style="width:64px; height:64px; border-radius:50%; border:none; background:#ff3b30; color:#fff; font-size:24px;"><i class="fa-solid fa-phone-slash"></i></button>
        </div>`;

      setTimeout(() => {
        document.getElementById('call-status').textContent = '통화 중 00:02';
        setTimeout(() => { endCall(); }, 8000);
      }, 2000);
    }

    function endCall() {
      if (!localStorage.getItem('yuma_call_msg_sent')) {
        state.messages.push({ sender: 'yuma', text: '연습 중!', time: '방금', unread: true });
        state.msgUnread++;
        localStorage.setItem('yuma_call_msg_sent', 'true');
        saveState();
      }
      openContact('ユウマ🐱🖤');
    }

    function renderMessages(body, title) {
      title.textContent = '메시지';
      state.msgUnread = 0;
      saveState();

      let html = `<div style="display:flex; flex-direction:column; height:100%;">
        <div class="chat-container" id="msg-box" style="flex:1; overflow-y:auto;">`;
      
      state.messages.forEach(m => {
        html += `<div class="bubble ${m.sender==='me'?'out':'in'}">${m.text}</div>`;
      });

      html += `</div>
        <form onsubmit="sendMsg(event)" class="chat-input-bar">
          <input type="text" id="msg-input" placeholder="메시지 보내기… 예: 나 지금 일어났어ㅠㅠ…" autocomplete="off">
          <button type="submit">↑</button>
        </form>
      </div>`;
      body.innerHTML = html;
      const box = document.getElementById('msg-box');
      box.scrollTop = box.scrollHeight;
    }

    function sendMsg(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const txt = input.value.trim();
      if (!txt) return;

      state.messages.push({ sender: 'me', text: txt, time: '방금' });
      saveState();
      renderMessages(document.getElementById('app-body'), document.getElementById('app-header-title'));

      if (txt === '나 이제 일어남…' || txt === '나 이제 일어남') {
        setTimeout(() => {
          state.messages.push({ sender: 'yuma', text: 'ㅋㅋㅋ 잘햇엉', time: '방금' });
          saveState();
          if (state.currentApp === 'messages') renderMessages(document.getElementById('app-body'), document.getElementById('app-header-title'));
          
          setTimeout(() => {
            state.messages.push({ sender: 'yuma', text: '잘잤어??', time: '방금' });
            saveState();
            if (state.currentApp === 'messages') renderMessages(document.getElementById('app-body'), document.getElementById('app-header-title'));
          }, 1500);
        }, 10000);
      }
    }

    function renderKakao(body, title) {
      title.textContent = '카카오톡';
      state.kakaoUnread = 0;
      saveState();

      let html = `<div style="display:flex; flex-direction:column; height:100%;">
        <div style="background:#abc1d1; padding:10px 16px; border-bottom:0.5px solid #9bb1c1; font-weight:700; display:flex; justify-content:space-between; align-items:center;">
          <span>🐱 유마</span>
          <div style="display:flex; gap:14px; font-size:18px;">
            <i class="fa-solid fa-phone" onclick="startCall()" style="cursor:pointer;"></i>
            <i class="fa-solid fa-video" style="opacity:0.5;"></i>
            <i class="fa-solid fa-bars" style="opacity:0.5;"></i>
          </div>
        </div>
        <div class="chat-container kakao" id="kakao-box" style="flex:1; overflow-y:auto;">`;

      state.kakao.forEach(k => {
        if (k.type === 'img') {
          html += `<div class="bubble ${k.sender==='me'?'out':'in'}" style="padding:4px; background:transparent;"><img src="${k.src}" style="width:160px; border-radius:12px;"></div>`;
        } else {
          html += `<div class="bubble ${k.sender==='me'?'out':'in'}">${k.text}</div>`;
        }
      });

      html += `</div>
        <form onsubmit="sendKakao(event)" class="chat-input-bar">
          <input type="text" id="kakao-input" placeholder="메시지 보내기… 예: 나 지금 일어났어ㅠㅠ…" autocomplete="off">
          <button type="submit" style="background:#fee500; color:#000;">↑</button>
        </form>
      </div>`;
      body.innerHTML = html;
      const box = document.getElementById('kakao-box');
      box.scrollTop = box.scrollHeight;
    }

    function sendKakao(e) {
      e.preventDefault();
      const input = document.getElementById('kakao-input');
      const txt = input.value.trim();
      if (!txt) return;
      state.kakao.push({ sender: 'me', text: txt });
      saveState();
      renderKakao(document.getElementById('app-body'), document.getElementById('app-header-title'));
    }

    function renderCalendar(body, title) {
      title.textContent = '캘린더';
      body.innerHTML = `
        <div style="padding:20px;">
          <h2 style="font-size:22px; font-weight:700; margin-bottom:16px;">2027년 2월</h2>
          <div style="background:#f2f2f7; border-radius:16px; padding:16px; border:1px solid #e5e5ea;">
            <div style="color:#ff3b30; font-weight:700; font-size:18px;">2월 7일 일요일</div>
            <div style="font-size:16px; font-weight:600; margin-top:6px;">유마 생일🎂</div>
            <div style="font-size:13px; color:#8e8e93; margin-top:2px;">하루 종일</div>
          </div>
        </div>`;
    }

    function renderMusic(body, title) {
      title.textContent = 'Apple Music';
      const songs = [
        ["죠지", "언제든 어디라도"],
        ["죠지", "좋아해.."],
        ["keshi", "Kiss Me Right"],
        ["DEAN", "What 2 Do"],
        ["back number", "Heroine"]
      ];

      let html = `
        <div style="padding:20px;">
          <div style="display:flex; gap:16px; align-items:center; margin-bottom:24px;">
            <img src="${ASSETS.applemusic_cover}" style="width:100px; height:100px; border-radius:12px; object-fit:cover; box-shadow:0 8px 20px rgba(0,0,0,0.15);">
            <div>
              <h2 style="font-size:20px; font-weight:700;">🖤</h2>
              <p style="color:#8e8e93; font-size:14px; margin-top:4px;">플레이리스트</p>
            </div>
          </div>
          <div>`;

      songs.forEach(s => {
        html += `
          <div style="padding:12px 0; border-bottom:0.5px solid #e5e5ea; display:flex; justify-content:space-between; align-items:center;" onclick="window.open('https://music.apple.com/kr/search?term=${encodeURIComponent(s[0]+' '+s[1])}')">
            <div>
              <div style="font-weight:600; font-size:15px;">${s[1]}</div>
              <div style="font-size:13px; color:#8e8e93; margin-top:2px;">${s[0]}</div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color:#c7c7cc; font-size:12px;"></i>
          </div>`;
      });

      html += `</div></div>`;
      body.innerHTML = html;
    }

    function renderInstagram(body, title) {
      title.textContent = 'Instagram';
      let html = `
        <div style="padding-bottom:20px;">
          <div style="border-bottom:1px solid #e5e5ea; padding-bottom:12px; margin-bottom:16px;">
            <div style="padding:10px 14px; font-weight:700; font-size:14px;">nyang2777</div>
            <img src="${ASSETS.ig_post1}" style="width:100%; height:320px; object-fit:cover;">
            <div style="padding:10px 14px;">
              <i class="${state.likedPosts[0]?'fa-solid fa-heart':'fa-regular fa-heart'}" style="font-size:22px; color:${state.likedPosts[0]?'#ff3b30':'#000'}; cursor:pointer;" onclick="toggleLike(0)"></i>
              <div style="font-size:14px; margin-top:6px;"><b>nyang2777</b> 이분 밤새고 한국 오셔서 피곤하시다네요..</div>
            </div>
          </div>

          <div>
            <div style="padding:10px 14px; font-weight:700; font-size:14px;">nyang2777</div>
            <div style="display:flex; overflow-x:auto; gap:4px; padding:0 14px;">
              <img src="${ASSETS.ig_post2[0]}" style="width:260px; height:280px; object-fit:cover; border-radius:8px; flex-shrink:0;">
              <video src="${ASSETS.ig_post2[1]}" controls style="width:260px; height:280px; object-fit:cover; border-radius:8px; flex-shrink:0;"></video>
              <img src="${ASSETS.ig_post2[2]}" style="width:260px; height:280px; object-fit:cover; border-radius:8px; flex-shrink:0;">
              <img src="${ASSETS.ig_post2[3]}" style="width:260px; height:280px; object-fit:cover; border-radius:8px; flex-shrink:0;">
            </div>
            <div style="padding:10px 14px;">
              <i class="${state.likedPosts[1]?'fa-solid fa-heart':'fa-regular fa-heart'}" style="font-size:22px; color:${state.likedPosts[1]?'#ff3b30':'#000'}; cursor:pointer;" onclick="toggleLike(1)"></i>
              <div style="font-size:14px; margin-top:6px;"><b>nyang2777</b> 고양이랑 머근 밥</div>
              <div style="font-size:13px; color:#3a3a3c; margin-top:6px; background:#f2f2f7; padding:8px 12px; border-radius:10px;">
                <b>2nakakita7</b> なんでやねん！！😒
              </div>
            </div>
          </div>
        </div>`;
      body.innerHTML = html;
    }

    function toggleLike(idx) {
      state.likedPosts[idx] = !state.likedPosts[idx];
      saveState();
      renderInstagram(document.getElementById('app-body'), document.getElementById('app-header-title'));
    }
  </script>
</body>
</html>
