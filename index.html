<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5fa">
<title>Yuma Simulation</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
<section id="lock-screen" class="screen lock-screen">
<div class="status"><span id="status-time">22:24</span><span>▮▮▮ ◉ 49%</span></div>
<div class="lock-date" id="lock-date"></div>
<div class="lock-time" id="lock-time">22:24</div>
<div class="lock-subtitle">잠금 해제하여 계속하기</div>
<div class="passcode-box">
<p>암호를 입력하세요</p>
<div class="dots" id="pass-dots">○ ○ ○ ○</div>
<div class="keypad" id="keypad"></div>
<button class="text-button" id="delete-key">지우기</button>
</div>
<p class="tiny-note">가상 팬 시뮬레이션입니다.</p>
</section>
<section id="home-screen" class="screen home-screen hidden">
<div class="status"><span id="home-time">22:24</span><span>▮▮▮ ◉ 49%</span></div>
<div class="home-date" id="home-date"></div>
<div class="app-grid">
<button class="app-icon" data-app="photos"><span class="icon tile-photos">🌸</span><span>사진</span></button>
<button class="app-icon" data-app="phone"><span class="icon tile-phone">📞</span><span>전화</span></button>
<button class="app-icon" data-app="messages"><span class="icon tile-messages">💬</span><span>메시지</span></button>
<button class="app-icon" data-app="kakao"><span class="icon tile-kakao">💬</span><span>KakaoTalk</span></button>
<button class="app-icon" data-app="calendar"><span class="icon tile-calendar"><b>토</b><strong>24</strong></span><span>캘린더</span></button>
<button class="app-icon" data-app="music"><span class="icon tile-music">♫</span><span>음악</span></button>
<button class="app-icon" data-app="instagram"><span class="icon tile-instagram">◎</span><span>Instagram</span></button>
<button class="app-icon" data-app="settings"><span class="icon tile-settings">⚙️</span><span>설정</span></button>
<button class="app-icon" data-app="camera"><span class="icon tile-camera">📷</span><span>카메라</span></button>
<button class="app-icon" data-app="clock"><span class="icon tile-clock">◷</span><span>시계</span></button>
</div>
<div class="dock">
<button class="dock-icon tile-phone" data-app="phone">📞</button>
<button class="dock-icon tile-messages" data-app="messages">💬</button>
<button class="dock-icon tile-kakao" data-app="kakao">🟡</button>
<button class="dock-icon tile-instagram" data-app="instagram">◎</button>
</div>
</section>
<section id="app-screen" class="screen app-screen hidden">
<div class="app-status"><span id="app-time">22:24</span><span>▮▮▮ ◉ 49%</span></div>
<header class="app-header">
<button id="back-home">‹</button>
<h1 id="app-title">메시지</h1>
<span></span>
</header>
<main id="app-content"></main>
<div class="home-indicator" id="home-indicator"></div>
</section>
<div id="toast" class="toast hidden">해당 사이트는 가상 시뮬레이션입니다.</div>
</div>
<script src="data.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
