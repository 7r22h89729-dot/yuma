<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yuma's iPhone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen p-0 sm:p-4 select-none">

    <!-- MEDIA CONFIGURATION -->
    <script>
        const MEDIA_CONFIG = {
            lockscreen_bg: 'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/IMG_4865.jpeg',
            homescreen_bg: 'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/IMG_4865.jpeg',
            profile_img: 'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/IMG_4865.jpeg',
            photos_app: [
                'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/IMG_4865.jpeg',
                'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/IMG_4887.jpeg',
                'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/weverse_20261023234617_2465981427.jpeg',
                'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/weverse_20261023234653_3116113101.jpeg',
                'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/weverse_20261023234703_929747686.jpeg'
            ],
            kakaotalk_chat_images: {
                childhood: 'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/weverse_20261023234617_2465981427.jpeg',
                practice: 'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/weverse_20261023234653_3116113101.jpeg',
                food: 'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/weverse_20261023234703_929747686.jpeg'
            },
            applemusic_cover: 'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/IMG_4887.jpeg',
            instagram_post1: [
                'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/IMG_4865.jpeg'
            ],
            instagram_post2: [
                'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/weverse_20261023234617_2465981427.jpeg',
                'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/weverse_20261023234645_1436093600.mp4',
                'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/weverse_20261023234653_3116113101.jpeg',
                'https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/weverse_20261023234703_929747686.jpeg'
            ]
        };
    </script>

    <!-- Main Phone Frame Container -->
    <div id="phone-container" class="relative w-full max-w-[390px] h-[844px] bg-black sm:rounded-[50px] overflow-hidden shadow-2xl border-0 sm:border-[8px] border-gray-800">
        
        <!-- TOP STATUS BAR -->
        <div id="status-bar" class="absolute top-0 left-0 w-full h-12 px-7 pt-3 flex justify-between items-center z-50 text-white font-semibold text-xs">
            <span id="status-time">23:59</span>
            <div class="w-24 h-5 bg-black rounded-full flex items-center justify-center space-x-1">
                <div class="w-2.5 h-2.5 rounded-full bg-gray-900"></div>
            </div>
            <div class="flex items-center space-x-1.5">
                <i class="fa-solid font-bold fa-signal text-[10px]"></i>
                <i class="fa-solid font-bold fa-wifi text-[10px]"></i>
                <i class="fa-solid font-bold fa-battery-full text-[12px]"></i>
            </div>
        </div>

        <!-- LOCK SCREEN -->
        <div id="lock-screen" class="absolute inset-0 bg-cover bg-center flex flex-col justify-between p-8 pt-16 z-40 transition-transform duration-500" style="background-image: url('https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/IMG_4865.jpeg');">
            <div class="flex flex-col items-center text-white mt-4">
                <i class="fa-solid fa-lock text-xs opacity-70 mb-1"></i>
                <h1 id="lock-time" class="text-6xl font-light tracking-tight">23:59</h1>
                <p id="lock-date" class="text-sm font-medium opacity-90 mt-1">10월 24일 토요일</p>
            </div>

            <!-- Passcode View -->
            <div class="flex flex-col items-center mb-8">
                <p class="text-xs text-white/80 mb-4">암호 입력 (0207)</p>
                <div class="flex space-x-3 mb-6" id="passcode-dots">
                    <div class="w-3 h-3 rounded-full border border-white"></div>
                    <div class="w-3 h-3 rounded-full border border-white"></div>
                    <div class="w-3 h-3 rounded-full border border-white"></div>
                    <div class="w-3 h-3 rounded-full border border-white"></div>
                </div>
                <div class="grid grid-cols-3 gap-4 w-64 text-center">
                    <button onclick="pressKey('1')" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md text-xl text-white font-medium active:bg-white/40">1</button>
                    <button onclick="pressKey('2')" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md text-xl text-white font-medium active:bg-white/40">2</button>
                    <button onclick="pressKey('3')" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md text-xl text-white font-medium active:bg-white/40">3</button>
                    <button onclick="pressKey('4')" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md text-xl text-white font-medium active:bg-white/40">4</button>
                    <button onclick="pressKey('5')" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md text-xl text-white font-medium active:bg-white/40">5</button>
                    <button onclick="pressKey('6')" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md text-xl text-white font-medium active:bg-white/40">6</button>
                    <button onclick="pressKey('7')" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md text-xl text-white font-medium active:bg-white/40">7</button>
                    <button onclick="pressKey('8')" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md text-xl text-white font-medium active:bg-white/40">8</button>
                    <button onclick="pressKey('9')" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md text-xl text-white font-medium active:bg-white/40">9</button>
                    <div></div>
                    <button onclick="pressKey('0')" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md text-xl text-white font-medium active:bg-white/40">0</button>
                    <button onclick="clearPasscode()" class="w-16 h-16 rounded-full flex items-center justify-center text-xs text-white">취소</button>
                </div>
            </div>
        </div>

        <!-- HOME SCREEN -->
        <div id="home-screen" class="absolute inset-0 bg-cover bg-center p-6 pt-16 flex flex-col justify-between hidden" style="background-image: url('https://raw.githubusercontent.com/7r22h89729-dot/yuma/main/IMG_4865.jpeg');">
            <!-- App Grid -->
            <div class="grid grid-cols-4 gap-5 pt-4">
                <div onclick="openApp('photos')" class="flex flex-col items-center cursor-pointer">
                    <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-images text-2xl text-yellow-500"></i>
                    </div>
                    <span class="text-[11px] text-white mt-1 shadow-sm">사진</span>
                </div>
                <div onclick="openApp('instagram')" class="flex flex-col items-center cursor-pointer">
                    <div class="w-14 h-14 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg">
                        <i class="fa-brands fa-instagram text-3xl text-white"></i>
                    </div>
                    <span class="text-[11px] text-white mt-1 shadow-sm">Instagram</span>
                </div>
                <div onclick="openApp('kakaotalk')" class="flex flex-col items-center cursor-pointer">
                    <div class="w-14 h-14 bg-[#FEE500] rounded-2xl flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-comment text-2xl text-[#3C1E1E]"></i>
                    </div>
                    <span class="text-[11px] text-white mt-1 shadow-sm">카카오톡</span>
                </div>
                <div onclick="openApp('music')" class="flex flex-col items-center cursor-pointer">
                    <div class="w-14 h-14 bg-gradient-to-b from-pink-500 to-red-500 rounded-2xl flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-music text-2xl text-white"></i>
                    </div>
                    <span class="text-[11px] text-white mt-1 shadow-sm">Music</span>
                </div>
            </div>

            <!-- Home Bar Indicator -->
            <div onclick="goHome()" class="w-32 h-1 bg-white/80 rounded-full mx-auto mb-2 cursor-pointer"></div>
        </div>

        <!-- APP CONTAINER -->
        <div id="app-view" class="absolute inset-0 bg-black z-30 hidden flex flex-col pt-12">
            <div class="flex-1 overflow-y-auto no-scrollbar" id="app-content"></div>
            <!-- Bottom Navigation / Home Indicator -->
            <div class="h-8 bg-black/90 flex items-center justify-center">
                <div onclick="goHome()" class="w-32 h-1 bg-white/80 rounded-full cursor-pointer"></div>
            </div>
        </div>

    </div>

    <!-- APP JS LOGIC -->
    <script>
        let enteredPasscode = "";

        function pressKey(num) {
            if (enteredPasscode.length < 4) {
                enteredPasscode += num;
                updateDots();
                if (enteredPasscode.length === 4) {
                    if (enteredPasscode === "0207") {
                        setTimeout(() => {
                            document.getElementById('lock-screen').classList.add('-translate-y-full');
                            setTimeout(() => {
                                document.getElementById('lock-screen').classList.add('hidden');
                                document.getElementById('home-screen').classList.remove('hidden');
                            }, 400);
                        }, 200);
                    } else {
                        alert("비밀번호가 올바르지 않습니다. (0207)");
                        clearPasscode();
                    }
                }
            }
        }

        function clearPasscode() {
            enteredPasscode = "";
            updateDots();
        }

        function updateDots() {
            const dots = document.getElementById('passcode-dots').children;
            for (let i = 0; i < 4; i++) {
                if (i < enteredPasscode.length) {
                    dots[i].classList.add('bg-white');
                } else {
                    dots[i].classList.remove('bg-white');
                }
            }
        }

        function goHome() {
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
        }

        function openApp(appName) {
            const appView = document.getElementById('app-view');
            const appContent = document.getElementById('app-content');
            appView.classList.remove('hidden');

            if (appName === 'photos') {
                let imgs = MEDIA_CONFIG.photos_app.map(url => `<img src="${url}" class="w-full h-28 object-cover rounded-lg">`).join('');
                appContent.innerHTML = `
                    <div class="p-4">
                        <h2 class="text-2xl font-bold mb-4">보관함</h2>
                        <div class="grid grid-cols-3 gap-2">${imgs}</div>
                    </div>`;
            } else if (appName === 'instagram') {
                let p2Media = MEDIA_CONFIG.instagram_post2.map(url => {
                    if(url.endsWith('.mp4')) {
                        return `<video src="${url}" controls class="w-full h-80 object-cover"></video>`;
                    }
                    return `<img src="${url}" class="w-full h-80 object-cover">`;
                }).join('');

                appContent.innerHTML = `
                    <div class="bg-black text-white min-h-full">
                        <div class="p-3 border-b border-gray-800 flex justify-between items-center">
                            <span class="font-bold text-lg">Instagram</span>
                            <i class="fa-regular fa-heart text-xl"></i>
                        </div>
                        <div class="p-3 flex items-center space-x-3">
                            <img src="${MEDIA_CONFIG.profile_img}" class="w-8 h-8 rounded-full">
                            <span class="font-semibold text-sm">yuma_andteam</span>
                        </div>
                        <img src="${MEDIA_CONFIG.instagram_post1[0]}" class="w-full h-80 object-cover">
                        <div class="p-3 text-sm"><span class="font-semibold">yuma_andteam</span> &TEAM Yuma 🖤</div>
                        
                        <div class="p-3 flex items-center space-x-3 mt-4">
                            <img src="${MEDIA_CONFIG.profile_img}" class="w-8 h-8 rounded-full">
                            <span class="font-semibold text-sm">yuma_andteam</span>
                        </div>
                        <div class="overflow-x-auto flex space-x-2 no-scrollbar">${p2Media}</div>
                    </div>`;
            } else if (appName === 'kakaotalk') {
                appContent.innerHTML = `
                    <div class="bg-[#B2C7DA] min-h-full p-4 text-black">
                        <div class="bg-white/80 backdrop-blur p-3 rounded-xl mb-4 text-center font-bold">유마 &TEAM</div>
                        <div class="space-y-3">
                            <div class="flex items-start space-x-2">
                                <img src="${MEDIA_CONFIG.profile_img}" class="w-8 h-8 rounded-full">
                                <div class="bg-white p-2.5 rounded-xl max-w-[70%] text-sm">안녕! 오늘 사진 보내줄게~</div>
                            </div>
                            <div class="flex items-start space-x-2">
                                <img src="${MEDIA_CONFIG.profile_img}" class="w-8 h-8 rounded-full">
                                <img src="${MEDIA_CONFIG.kakaotalk_chat_images.childhood}" class="w-48 rounded-xl">
                            </div>
                        </div>
                    </div>`;
            } else if (appName === 'music') {
                appContent.innerHTML = `
                    <div class="p-6 flex flex-col items-center justify-center min-h-full">
                        <img src="${MEDIA_CONFIG.applemusic_cover}" class="w-64 h-64 rounded-2xl shadow-2xl mb-6">
                        <h2 class="text-xl font-bold">War Cry</h2>
                        <p class="text-gray-400 text-sm mt-1">&TEAM</p>
                        <div class="flex items-center space-x-8 mt-8 text-2xl">
                            <i class="fa-solid fa-backward"></i>
                            <i class="fa-solid fa-play text-4xl"></i>
                            <i class="fa-solid fa-forward"></i>
                        </div>
                    </div>`;
            }
        }
    </script>
</body>
</html>
